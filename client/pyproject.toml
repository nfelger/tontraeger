[project]
name = "tontraeger-client"
version = "0.1.0"
description = "tontraeger client — NFC tag reading and Sonos playback"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.1",
    "requests>=2.31",
    "soco>=0.30.0",
]

[tool.ruff]
lint.select = ["E", "F", "B", "ANN"]
lint.ignore = ["E501"]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = 3.11
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.6",
    "types-requests>=2.32.4.20260107",
]
